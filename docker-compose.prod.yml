version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Database: PostgreSQL 16 Alpine
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: queueapp-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-queueapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-queueapp_secure_prod_password}
      POSTGRES_DB: ${POSTGRES_DB:-queueapp_prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-queueapp} -d ${POSTGRES_DB:-queueapp_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - queueapp-network

  # ----------------------------------------------------------------------------
  # 2. In-Memory Cache & Message Broker: Redis 7 Alpine
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: queueapp-redis-prod
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - queueapp-network

  # ----------------------------------------------------------------------------
  # 3. Backend API: NestJS + Prisma Server
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: queueapp-api-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:-postgresql://queueapp:queueapp_secure_prod_password@postgres:5432/queueapp_prod?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-prod_access_secret_change_me_super_secure}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-prod_refresh_secret_change_me_super_secure}
      JWT_ACCESS_EXPIRY: "15m"
      JWT_REFRESH_EXPIRY: "7d"
      OTP_EXPIRY_MINUTES: 5
      OTP_PROVIDER: ${OTP_PROVIDER:-sms}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY:-}
      MSG91_TEMPLATE_ID: ${MSG91_TEMPLATE_ID:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_WHATSAPP_TOKEN: ${META_WHATSAPP_TOKEN:-}
      META_WHATSAPP_PHONE_NUMBER_ID: ${META_WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
    networks:
      - queueapp-network

  # ----------------------------------------------------------------------------
  # 4. Frontend Client & Reverse Proxy: Nginx + React SPA
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: queueapp-web-prod
    restart: always
    depends_on:
      - api
    ports:
      - "${PORT:-80}:80"
    networks:
      - queueapp-network

networks:
  queueapp-network:
    driver: bridge

volumes:
  pgdata_prod:
  redisdata_prod:
